<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e4e4e7; padding: 32px;">
  <div style="max-width: 480px; margin: 0 auto; background: #18181b; border-radius: 12px; padding: 24px; border: 1px solid #27272a;">
    <h2 style="margin: 0 0 8px; font-size: 18px;">{{ title }}</h2>
    <p style="margin: 0 0 16px; color: #a1a1aa; font-size: 14px;">{{ message }}</p>
    {% if work_item %}
    <div style="background: #27272a; border-radius: 8px; padding: 12px; margin-bottom: 16px;">
      <p style="margin: 0; font-size: 12px; color: #71717a;">{{ notification_type }}</p>
      <p style="margin: 4px 0 0; font-size: 14px; color: #e4e4e7;">{{ work_item.key }} — {{ work_item.title }}</p>
    </div>
    {% endif %}
    <p style="margin: 0; font-size: 11px; color: #52525b;">HertexFlow — ByteHive Business Suite</p>
  </div>
</body>
</html>
