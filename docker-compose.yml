# Local repro of the production deployment.
#   docker compose up --build
# App:  http://localhost:8000   Postgres: localhost:5432   Redis: localhost:6379
#
# Override secrets (SECRET_KEY, CLOUDINARY_*) by exporting them in your shell
# or by editing the `environment:` block below before deploying for real.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suite
      POSTGRES_USER: suite
      POSTGRES_PASSWORD: suite
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suite -d suite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Required by Channels (CHANNEL_LAYERS) for WebSocket fan-out.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    # `environment` wins over any .env file, so the compose services are used.
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8000"
      DATABASE_URL: postgres://suite:suite@db:5432/suite
      REDIS_URL: redis://redis:6379/0
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
