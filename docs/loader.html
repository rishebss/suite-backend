<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hertex Loader</title>
<style>
  :root {
    --zinc-950: #09090b;
    --blue-500: #3b82f6;
    --blue-400: #60a5fa;
    --blue-300: #93c5fd;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--zinc-950); }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ambient breathing glow behind everything */
  .glow {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.22) 0%, rgba(59,130,246,0.06) 45%, transparent 70%);
    filter: blur(10px);
    animation: breathe 3.2s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.88); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .loader-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  .mark {
    width: 160px;
    height: auto;
    overflow: visible;
    animation: markbreathe 3.2s ease-in-out infinite;
  }

  @keyframes markbreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  .fill {
    fill: rgba(59, 130, 246, 0.2);
    animation: fillshift 3.2s ease-in-out infinite;
  }

  @keyframes fillshift {
    0%, 100% { fill: rgba(59, 130, 246, 0.16); }
    50% { fill: rgba(59, 130, 246, 0.28); }
  }

  .beam {
    fill: none;
    stroke: var(--blue-400);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 18 82;
    filter: drop-shadow(0 0 6px var(--blue-500)) drop-shadow(0 0 14px rgba(59,130,246,0.6));
  }

  /* group 1: large outer X path, 2.6s loop */
  .g1 {
    animation: run 2.6s linear infinite;
  }

  /* group 2: small bottom-left piece, 1.5s loop to feel consistent in speed */
  .g2 {
    animation: run 1.5s linear infinite;
  }

  @keyframes run {
    to { stroke-dashoffset: -100; }
  }

  .label {
    display: flex;
    align-items: baseline;
    gap: 2px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a1a1aa;
  }

  .label .dot { animation: blink 1.4s infinite; opacity: 0; }
  .label .dot:nth-child(1) { animation-delay: 0s; }
  .label .dot:nth-child(2) { animation-delay: 0.2s; }
  .label .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
  }
</style>
</head>
